name: ci-server

# Split out of the old combined `ci` workflow so a client-only change does not
# pay for a ~5 minute Rust build. GitHub has no per-job `paths` filter, so one
# workflow per side is the only way to get this without a third-party
# changed-files action.
#
# Nothing under client/ can affect this job: server/build.rs only requires
# client/dist/index.html for *release* builds, and CI builds the dev profile.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/ci-server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/ci-server.yml'

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `stable` matches `channel` in server/rust-toolchain.toml, so cargo uses
      # the toolchain this step installs instead of fetching a second one.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}

      - name: cargo fmt
        run: cd server && cargo fmt --check

      - name: cargo clippy
        run: cd server && cargo clippy -- -D warnings

      - name: cargo test
        run: cd server && RUST_TEST_THREADS=1 cargo test
