[package]
name = "discool-server"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "multipart"] }
axum-prometheus = "0.10"
bs58 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
config = { version = "0.15", features = ["toml"] }
ed25519-dalek = { version = "3", features = ["alloc"] }
dashmap = "6"
rand = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "macros", "postgres", "sqlite", "migrate", "uuid", "chrono", "json"] }
tokio = { version = "1", features = ["full"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
aes-gcm = { version = "0.11", features = ["aes"] }
base64 = "0.23"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
# libp2p-swarm 0.48 pins `wasm-bindgen-futures = "=0.4.58"` (wasm targets
# only), and Cargo.lock resolves for every target, so it holds the
# wasm-bindgen family and futures-timer 3.0.3 below their latest. No effect
# on this native build: the wasm crates are never compiled, and 3.0.4's
# overflow guard in `Delay::new` only matters for huge durations, which
# nothing here passes (libp2p-swarm guards its idle timeout itself).
libp2p = { version = "0.57", features = ["gossipsub", "identify", "kad", "macros", "noise", "tcp", "tokio", "yamux"] }
sha2 = "0.11"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
scraper = "0.27"
url = "2"
webrtc = "0.21"
