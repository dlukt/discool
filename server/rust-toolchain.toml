[toolchain]
# Single source of truth for the Rust version. Keep in sync with the `rust:`
# base image in /Dockerfile and the `dtolnay/rust-toolchain@` ref in the CI
# workflows -- a mismatch still builds, but makes rustup download a second
# toolchain on every run.
channel = "1.98.1"
components = ["rustfmt", "clippy"]
